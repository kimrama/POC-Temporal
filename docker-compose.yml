services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: temporal@temporal.com
      PGADMIN_DEFAULT_PASSWORD: temporal
    ports:
      - "8081:80"

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      - postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.36.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:5173
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
  backend:
    build:
      context: ./backend
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - WORKFLOW_TASK_QUEUE=computer-task-queue
      - FRONTEND_ORIGIN=http://localhost:5173
    ports:
      - "8000:8000"

  worker-computer:
    build:
      context: ./worker-computer
      dockerfile: Dockerfile.computer
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - COMPUTER_TASK_QUEUE=computer-task-queue
